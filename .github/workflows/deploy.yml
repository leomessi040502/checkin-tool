name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 生产构建必须注入 anon key；缺少时直接失败，避免部署出白屏版本。
      # 变量放 Variables 或 Secrets 都支持，Secrets 优先兜底见下方表达式。
      - name: Verify build env
        env:
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 VITE_SUPABASE_ANON_KEY。请在仓库 Settings → Secrets and variables → Actions 中添加（Variables 或 Secrets 均可）后重新运行。"
            exit 1
          fi
          echo "VITE_SUPABASE_ANON_KEY 已配置（长度 ${#VITE_SUPABASE_ANON_KEY}）"

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # 只靠进程环境变量注入不可靠（不同 Vite 版本对 process.env 的合并行为不一致），
          # 显式写 .env.production 让 Vite 一定读得到。
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' \
            "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > .env.production
          npm run build
          rm -f .env.production
          # 产物自检：注入值必须真的进了 bundle，且不能是缺配置空壳。
          # 任何一项不满足都直接失败，绝不部署白屏版本。
          if ! grep -qF -- "$VITE_SUPABASE_ANON_KEY" dist/assets/*.js; then
            echo "::error::构建产物未包含 VITE_SUPABASE_ANON_KEY，请检查 Actions 变量配置"
            exit 1
          fi
          if grep -qF "缺少 VITE_SUPABASE_ANON_KEY" dist/assets/*.js; then
            echo "::error::构建产物是缺配置空壳，已阻止部署"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
